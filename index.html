<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giftora | Curated Gifts</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #fff5f8;
  color: #333;
  scroll-behavior: smooth;
}

header {
  background: linear-gradient(135deg, #ffb6c1, #ffd6e8);
  padding: 70px 20px;
  text-align: center;
}

header h1 {
  font-size: 3rem;
  color: #5a2a3c;
}

header p {
  color: #6b3b4f;
}

.btn {
  display: inline-block;
  margin-top: 25px;
  padding: 12px 30px;
  background: #ff5f8a;
  color: white;
  text-decoration: none;
  border-radius: 30px;
  font-weight: 600;
  cursor: pointer;
}

.btn:hover {
  background: #e94b74;
}

section {
  padding: 60px 20px;
  max-width: 1100px;
  margin: auto;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 30px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  text-align: center;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-8px);
}

.card h3 {
  color: #ff5f8a;
}

footer {
  background: #ffd6e8;
  text-align: center;
  padding: 20px;
  color: #5a2a3c;
}
</style>
</head>

<body>

<header>
  <h1>Giftora</h1>
  <p>Curated gift boxes made to express feelings 💝</p>
  <a class="btn" onclick="scrollToGifts()">Explore Gifts</a>
</header>

<section id="gifts">
  <h2 style="text-align:center;">Our Popular Boxes 🎁</h2>

  <div class="cards">
    <div class="card" onclick="orderGift('Love Loop Box')">
      <h3>💖 Love Loop Box</h3>
      <p>Perfect for couples & surprises</p>
    </div>

    <div class="card" onclick="orderGift('Birthday Bliss Box')">
      <h3>🎂 Birthday Bliss Box</h3>
      <p>Make birthdays extra special</p>
    </div>

    <div class="card" onclick="orderGift('Cute Mini Surprise Box')">
      <h3>🧸 Cute Mini Box</h3>
      <p>Small box, big smile</p>
    </div>
  </div>
</section>

<section style="text-align:center;">
  <h2>Order via WhatsApp 💬</h2>
  <a class="btn" onclick="openWhatsApp()">Chat Now</a>
</section>

<footer>
  © 2026 Giftora • Made with love 💕
</footer>

<script>
function scrollToGifts() {
  document.getElementById("gifts").scrollIntoView();
}

function orderGift(boxName) {
  alert("You selected: " + boxName);
  openWhatsApp(boxName);
}

function openWhatsApp(product = "") {
  let phone = "91XXXXXXXXXX"; // replace with your number
  let message = "Hi Giftora! I want to order: " + product;
  let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
  window.open(url, "_blank");
}
</script>

</body>
</html>
